[project]
name = "flowguard-backend"
version = "0.1.0"
description = "AICTE FlowGuard backend (Smart India Hackathon 2026 prototype)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "email-validator>=2.3.0",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI dependencies use calls in argument defaults

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is migrations, not the library

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]
