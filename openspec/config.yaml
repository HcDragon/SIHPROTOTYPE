schema: spec-driven

context: |
  Project: AICTE FlowGuard, a Smart India Hackathon 2026 prototype (MVP).
  A workflow and compliance intelligence layer for AICTE approvals: application
  tracking, pending actions, scrutiny and re-scrutiny, EVC (Expert Visit
  Committee) coordination, compliance monitoring, rule-based alerts, human
  review, and audit logging. It assists AICTE staff; it does NOT replace
  AICTE's approval portal or the authorized decision-makers.

  Stack: React + TypeScript + Vite frontend; FastAPI (Python) backend with
  Pydantic, SQLAlchemy 2.x (sync, psycopg 3) and Alembic; PostgreSQL run
  locally with Docker Compose; OpenAPI docs generated by FastAPI; Pytest and
  HTTPX for tests. Python is pinned to a version all dependencies support
  (managed with uv). Single deployable backend (a modular monolith) with an
  in-process scheduler for a single-instance demo. No managed or external
  database (no Supabase), microservices, message brokers, or extra
  infrastructure unless a change justifies it.

  Backend architecture:
  - REST API versioned under /api/v1.
  - Feature modules, each split into router, service, repository, models,
    and schemas. Routers hold no business logic; repositories hold only
    queries; modules use each other's services, not repositories.
  - Each request is one transaction; the audit entry is written in the same
    transaction as the change it records.
  - Centralized exception handling with one error response format.
  - All configuration comes from environment variables.

  Roles (one per user, fixed in code): Super Admin, AICTE Admin, Regional
  Officer, Scrutiny Officer, EVC Coordinator, Institution Representative,
  Auditor. Super Admin administers the system (users, alert rules) and
  performs no business workflow actions. Auditor is read-only. EVC panel
  experts are records, not user accounts.

  Hard constraints:
  - No real AICTE APIs, portals, or production data. All data is fictional;
    institution names, people, and identifiers must be clearly fake.
  - Only the FastAPI backend connects to PostgreSQL; the frontend never
    accesses the database directly.
  - Authentication uses Argon2id password hashing and short-lived JWT access
    tokens with refresh tokens stored hashed server-side. The current user is
    reloaded on each request so deactivation and role changes apply at once.
  - Authorization is enforced on the backend in two layers: a role-to-
    permission map, then record scope (Institution Representative: own
    institution; Regional Officer: own region; Scrutiny Officer: assigned
    applications). Records outside a user's scope return 404.
  - External concerns (OCR, LLM, email, file storage) sit behind adapter
    interfaces with a deterministic local/fake implementation as default.
  - The backend validates all input; the frontend only reflects permissions.
  - The LLM never approves, rejects, or changes workflow state. AI output is
    a suggestion stored as unverified until a human reviewer confirms it.
  - Application status changes only through explicit, allow-listed workflow
    transitions, each checked for role and current status, and recorded in
    the audit log. No endpoint writes status directly.
  - Final approval or rejection is a decision entered by a human AICTE Admin
    with a mandatory reason; the system records it and never makes it.
  - Audit log entries are append-only (enforced in the database) and record
    actor, role, action, target, timestamp, and before/after values.
  - Secrets come from environment variables; commit only .env.example.
    Never commit secrets or database credentials.
  - Alembic is the only way to change the schema.
  - Seed data is fictional, idempotent, and reproducible from a script.
  - Automated tests run against a separate disposable Compose PostgreSQL
    database, never the development database.
  - Dependency versions are pinned (lockfiles) and mutually compatible.
  - Local setup must work on Windows, macOS, and Linux.
  - All timestamps must be stored in UTC and displayed in the user's
    configured timezone.
  - API endpoints must use consistent response and error formats.
  - Pagination, filtering, and sorting must be supported for
    application and audit-log listing endpoints.
  - Sensitive fields must not appear in application logs.
  - Automated tests must cover critical workflow transitions.

  Team: a small hackathon team. Prefer simple, readable designs over
  abstraction; every feature must be testable and demonstrable with seed data.

rules:
  proposal:
    - Keep proposals under 600 words and state what is explicitly out of scope
    - Name the user roles affected by the change

  specs:
    - For every protected action, include a scenario where an unauthorized role is denied
    - For any state-changing action, include a scenario showing the audit log entry it produces
    - Describe AI-assisted output as unverified until a human confirms it
    - Specify role-based data scope and 404 behavior for unauthorized records
    - Require a mandatory reason for human-entered approval or rejection
    - Specify refresh-token hashing, rotation and revocation behavior
    - Include denial scenarios for Super Admin business workflow actions

  design:
    - Note any new dependency with its pinned version and why it was chosen
    - Describe new tables and Alembic migration impact when the data model changes
    - List new or changed workflow transitions as (from status, action, to status, allowed roles, guard)
    - Update the role-permission matrix when permissions change

  tasks:
    - Include seed-data updates needed to demonstrate the change
    - Include backend tests for permission checks on new endpoints
    - Keep each task completable and verifiable in under two hours
    - Include migration verification (upgrade, downgrade, no autogenerate drift) when the schema changes

operations:
  apply:
    guidance:
      - Run backend and frontend tests touched by the change before marking a task group done
      - Never commit secrets or real personal data while implementing
      - Verify database connectivity using environment-based configuration
